version: '3.8'

services:
  file-watcher:
    build: .
    container_name: discord-file-watcher
    restart: unless-stopped
    volumes:
      - ${WATCH_FOLDER:-./watch}:/watch
      - ${STATE_FILE_PATH:-./data}:/data
    env_file:
      - .env
    environment:
      - WATCH_FOLDER=${WATCH_FOLDER:-/watch}
      - STATE_FILE=${STATE_FILE:-/data/state.json}
